name: Build Calculator Vault

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Prepare signing key
        env:
          S1: ${{ secrets.KEYSTORE_BASE64 }}
          S2: ${{ secrets.KEYSTORE_PASSWORD }}
          S3: ${{ secrets.KEY_DHILLON }}
          S4: ${{ secrets.KEY_MAMA }}
          S5: ${{ secrets.KEY_PAPA }}
          S6: ${{ secrets.KEY_PASSWORD }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^Value:[[:space:]]*//'; }
          KS="$RUNNER_TEMP/upload.jks"
          found_ks=""
          for v in "$S1" "$S2" "$S3" "$S4" "$S5" "$S6"; do
            if [ ${#v} -gt 1000 ]; then
              printf '%s' "$v" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null && found_ks=1 && break
            fi
          done
          if [ -z "$found_ks" ]; then echo "::warning::No keystore secret found (a secret holding the very long line)."; exit 0; fi
          for v in "$S1" "$S2" "$S3" "$S4" "$S5" "$S6"; do
            [ -z "$v" ] && continue
            [ ${#v} -gt 200 ] && continue
            pw=$(clean "$v")
            if keytool -list -keystore "$KS" -storepass "$pw" > /dev/null 2>&1; then
              echo "::add-mask::$pw"
              echo "CV_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
              echo "CV_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
              echo "CV_KEY_PASSWORD=$pw" >> "$GITHUB_ENV"
              echo "SIGNED=1" >> "$GITHUB_ENV"
              echo "Signing key and password found."
              exit 0
            fi
          done
          echo "::warning::Keystore found but no secret matched its password."

      - name: Build app bundle (.aab) and test APK
        env:
          CV_KEY_ALIAS: upload
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Warn if not signed
        if: env.SIGNED != '1'
        run: echo "::warning::No signing secrets set. The .aab is NOT signed and Google Play will reject it. Add the 2 secrets KEYSTORE_PASSWORD and KEYSTORE_BASE64 and run again."

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-vault-build-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
