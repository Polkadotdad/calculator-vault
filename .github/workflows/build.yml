name: Build Calculator Vault

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "CV_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build app bundle (.aab) and test APK
        env:
          CV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CV_KEY_ALIAS: upload
          CV_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Warn if not signed
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No signing secrets set. The .aab is NOT signed and Google Play will reject it. Add the 2 secrets KEYSTORE_PASSWORD and KEYSTORE_BASE64 and run again."

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-vault-build-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
